services:
  postgres:
    image: postgres:16-alpine
    container_name: antd-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antd_db
    volumes:
      # This maps a "postgres_data" folder in your current directory to the container
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    container_name: antd-mosquitto
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: antd-redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/antd-backend:${BACKEND_VERSION:-latest}
    container_name: antd-backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/antd_db
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - mosquitto
    restart: unless-stopped

  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io/your-org}/antd-frontend:${FRONTEND_VERSION:-latest}
    container_name: antd-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    restart: unless-stopped