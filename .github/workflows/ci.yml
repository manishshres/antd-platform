name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace apps/backend
      - name: Unit tests
        run: npm test --workspace apps/backend

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/frontend

  lint-backend:
    name: Lint (backend, gating)
    runs-on: ubuntu-latest
    # The backend is lint-clean (N9: 193 errors -> 0), so this is a hard gate now.
    # Keep it that way: `npm run lint --workspace apps/backend` must stay at 0 errors.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend lint
        run: npm run lint --workspace apps/backend

  lint-frontend:
    name: Lint (frontend, informational)
    runs-on: ubuntu-latest
    # Still non-blocking: the frontend carries its own lint debt and had not been
    # verified when the backend was cleaned. Drop continue-on-error once it is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend lint
        run: npm run lint --workspace apps/frontend
