name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --workspace apps/backend
      - name: Unit tests
        run: npm test --workspace apps/backend

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/frontend

  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    # Non-blocking for now: the repo carries pre-existing lint debt. Remove
    # continue-on-error once `npm run lint` is green in both workspaces so lint
    # becomes a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend lint
        run: npm run lint --workspace apps/backend
      - name: Frontend lint
        run: npm run lint --workspace apps/frontend
