sonar.projectKey=Coneeko
sonar.projectName=Coneeko Platform

# Analyze application + shared source only.
sonar.sources=apps,packages

# Keep build artifacts, deps, generated code, and native project dirs out.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/.expo/**,**/android/**,**/ios/**,**/coverage/**,**/drizzle/**,**/*.d.ts,**/*.config.js,**/*.config.ts

# Treat spec/test files as tests, not production code.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

sonar.sourceEncoding=UTF-8
